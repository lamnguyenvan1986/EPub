# Build bản web và đưa lên GitHub Pages: https://lamnguyenvan1986.github.io/EPub/
# Cần bật Settings > Pages > Source: "GitHub Actions" (repo private thì cần GitHub Pro).
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Thư viện giọng offline trên web (onnxruntime-web, piper_phonemize) vào web/piper/vendor/
      - run: ./tool/fetch_piper_web.sh
      # Đóng gói CanvasKit cùng app (không tải từ gstatic) để chạy cả khi mạng chặn CDN.
      # GOOGLE_WEB_CLIENT_ID: biến repo (Settings > Secrets and variables > Actions > Variables)
      - run: >-
          flutter build web --release --base-href /EPub/ --no-wasm-dry-run --no-web-resources-cdn
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
