name: libri_audio
description: Một ứng dụng đọc sách với tính năng nghe audio, lưu vị trí, chọn giọng đọc, đánh dấu, ghi chú và đồng bộ với Firebase.
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Google & Drive
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3
  http: ^1.2.0
  file_picker: ^13.1.0
  file_picker_web: ^4.2.0  # Tuỳ chọn riêng cho web (Safari iOS)
  # EPUB & PDF
  katbook_epub_reader: ^2.1.2
  archive: ^4.0.5  # Sửa file EPUB lỗi mục lục (epub_repair.dart)
  pdfrx: ^2.6.1
  pdf: ^3.12.0
  # TTS & Audio (Miễn phí cho tiếng Việt)
  flutter_tts: ^4.0.2  # Hỗ trợ tiếng Việt tốt nhất (miễn phí)
  audio_service: ^0.18.13  # Phát TTS nền + thông báo điều khiển
  wakelock_plus: ^1.1.3  # Tắt tự động sleep khi nghe audio
  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  # UI & State
  riverpod: ^3.4.3
  provider: ^6.1.5+1
  # Utilities
  path: ^1.9.0
  uuid: ^4.3.3
  flutter_secure_storage: ^11.2.0
  # Xử lý văn bản
  html: ^0.15.4
  # Firebase (nâng cao)
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  # Xử lý ảnh
  image_picker: ^1.0.5
  # Chia sẻ & Export
  share_plus: ^13.3.0
  path_provider: ^2.1.2
  # Hiệu ứng
  lottie: ^3.3.0
  flutter_spinkit: ^5.2.0
  # Xử lý JSON
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

# image 4.11.0 gọi ZLibDecoder.decodeLazy, hàm không có trong archive 4.0.x; gói pdf
# lại giới hạn archive <4.1.0 nên build lỗi trên mọi nền tảng. Ghim image bản cũ hơn.
dependency_overrides:
  image: 4.10.2

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf