name: libri_audio
description: Một ứng dụng đọc sách với tính năng nghe audio, lưu vị trí, chọn giọng đọc, đánh dấu, ghi chú và đồng bộ với Firebase.
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Google & Drive
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.0
  file_picker: ^12.2.0
  # EPUB & PDF
  epub_kit: ^0.1.0
  flutter_pdfview: ^1.3.2
  # TTS & Audio (Miễn phí cho tiếng Việt)
  flutter_tts: ^4.0.2  # Hỗ trợ tiếng Việt tốt nhất (miễn phí)
  just_audio: ^0.10.6  # Phát audio nền
  audio_session: ^0.2.4
  audio_service: ^0.18.13
  wakelock_plus: ^1.1.3  # Tắt tự động sleep khi nghe audio
  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  # UI & State
  riverpod: ^3.4.3
  provider: ^6.1.5+1
  # Utilities
  path: ^1.9.0
  uuid: ^4.3.3
  flutter_secure_storage: ^11.0.0
  # Xử lý văn bản
  html: ^0.15.4
  # Firebase (nâng cao)
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.6.0
  # Xử lý ảnh
  image_picker: ^1.0.5
  # Chia sẻ & Export
  share_plus: ^13.3.0
  path_provider: ^2.1.2
  pdf: ^3.10.6
  # Hiệu ứng
  lottie: ^3.3.0
  flutter_spinkit: ^5.2.0
  # Xử lý JSON
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  # uses_material_design: true  # Optional; defaults to true in modern Flutter
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
